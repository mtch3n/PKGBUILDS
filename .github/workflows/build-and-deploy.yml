name: Build and Deploy Repo

on:
  push:
    branches: [main]
    # Every top-level directory is a package; the rest is scaffolding.
    paths-ignore:
      - ".github/**"
      - "README.md"
  # Keeps *-git packages current: their source moves without the PKGBUILD.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
    steps:
      - name: Setup system
        run: |
          pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # Accumulating cache: restored by prefix, written back as a superset.
      - name: Restore built-package cache
        uses: actions/cache@v4
        with:
          path: /build/cache
          key: pkgcache-${{ github.run_id }}
          restore-keys: pkgcache-

      - name: Build packages
        run: |
          set -euo pipefail
          root="$PWD"
          mkdir -p /build/repo /build/cache
          for pkgdir in */; do
            [ -f "$pkgdir/PKGBUILD" ] || continue
            name="${pkgdir%/}"

            # *-git sources move without the directory changing, so a cached
            # build of one is stale by definition; everything else is keyed on
            # its own contents and only rebuilds when they change.
            if [[ "$name" == *-git ]]; then
              stamp=""
            else
              stamp="$(find "$pkgdir" -type f -exec sha256sum {} + | sort | sha256sum | cut -c1-16)"
            fi

            if [ -n "$stamp" ] && compgen -G "/build/cache/$name-$stamp/*.pkg.tar.zst" >/dev/null; then
              echo "::notice::$name unchanged — reusing cached build"
              cp "/build/cache/$name-$stamp/"*.pkg.tar.zst /build/repo/
              continue
            fi

            echo "::group::Building $name"
            rm -rf /build/pkg
            cp -r "$root/$pkgdir" /build/pkg
            chown -R builder:builder /build/pkg
            # Subshell: the loop must come back to the checkout, or every
            # package after the first is silently skipped.
            ( cd /build/pkg && sudo -u builder makepkg -s --noconfirm --skippgpcheck )
            # Deliberately no `|| true` — a missing artifact should fail the run.
            cp /build/pkg/*.pkg.tar.zst /build/repo/
            if [ -n "$stamp" ]; then
              mkdir -p "/build/cache/$name-$stamp"
              cp /build/pkg/*.pkg.tar.zst "/build/cache/$name-$stamp/"
            fi
            rm -rf /build/pkg
            echo "::endgroup::"
          done
          echo "Built artifacts:"
          ls -1 /build/repo

      - name: Create repo database
        run: |
          cd /build/repo
          repo-add mtch3n.db.tar.gz *.pkg.tar.zst

          # repo-add creates symlinks; GitHub Pages needs real files
          for link in mtch3n.db mtch3n.files; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
            fi
          done

          ls -la

      - name: Prepare Pages directory
        run: |
          mkdir -p /build/pages/x86_64
          cp /build/repo/* /build/pages/x86_64/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
